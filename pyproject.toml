[project]
name = "athletevalue"
version = "0.3.1"
description = "Open models that separate what a college athlete is worth to a program from what the market pays"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "John Hodge" }]
keywords = [
    "college-basketball", "nil", "rapm", "plus-minus", "sports-economics",
    "wins-above-replacement", "revenue-sharing", "reproducible-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fastexcel>=0.11",
    "httpx>=0.27",
    "numpy>=1.26",
    "platformdirs>=4.0",
    "polars>=1.0",
    "pydantic>=2.9",
    "scipy>=1.12",
    "threadpoolctl>=3.1",
    "typer>=0.12",
]

[project.scripts]
athletevalue = "athletevalue.cli.main:app"

[project.urls]
Homepage = "https://github.com/jman4162/athletevalue"
Repository = "https://github.com/jman4162/athletevalue"
Issues = "https://github.com/jman4162/athletevalue/issues"
Changelog = "https://github.com/jman4162/athletevalue/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.14",
]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athletevalue"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".venv*", "site", "*.local.md"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "RUF001",  # evidence-status glyphs are intentional
    "RUF002",
    "N803",    # X for design matrices follows the statistics convention
    "N806",
]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call defaults, and column layouts read best on one line.
"src/athletevalue/cli/*" = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["athletevalue"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "fastexcel.*", "threadpoolctl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config -m 'not network'"
markers = [
    "network: downloads full seasons from public sources; run with -m network",
]

[tool.coverage.run]
source = ["src/athletevalue"]
branch = true
omit = ["src/athletevalue/cli/*"]

# ---------------------------------------------------------------------------
# Layer boundaries
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "athletevalue"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "athletevalue.cli",
    "athletevalue.api",
    "athletevalue.sports",
    "athletevalue.valuation",
    "athletevalue.market",
    "athletevalue.economics",
    "athletevalue.wins",
    "athletevalue.impact",
    "athletevalue.frames",
    "athletevalue.identity",
    "athletevalue.uncertainty",
    "athletevalue.sources",
    "athletevalue.assumptions",
    "athletevalue.schemas",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Modelling layer does no I/O"
type = "forbidden"
source_modules = [
    "athletevalue.frames",
    "athletevalue.impact",
    "athletevalue.wins",
    "athletevalue.economics",
    "athletevalue.market",
    "athletevalue.valuation",
]
forbidden_modules = ["athletevalue.sources", "athletevalue.cli", "httpx"]

[[tool.importlinter.contracts]]
name = "Restricted user-supplied data never reaches fitting code"
type = "forbidden"
source_modules = [
    "athletevalue.impact",
    "athletevalue.wins",
    "athletevalue.economics",
    "athletevalue.market",
    "athletevalue.sports",
    "athletevalue.api",
]
forbidden_modules = ["athletevalue.sources.user_csv"]
