name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/

      - name: Layer boundaries
        run: uv run lint-imports

      - name: Tests
        # Offline only: the network suite downloads full seasons and runs weekly.
        # The floor sits just under the measured coverage and should only go up.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Package builds and its metadata renders
        run: |
          uv build
          uvx twine check dist/*
