name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --group dev --extra viz

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/

      - name: Layer boundaries
        run: uv run lint-imports

      - name: Tests
        # Offline only: the network suite downloads full seasons and runs weekly.
        # The floor sits just under the measured coverage and should only go up.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: README figures are current
        # Figures are drawn from the committed snapshot with a pinned matplotlib minor
        # version, so regenerating them must leave no diff.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          uv run python scripts/generate_readme_figures.py
          git diff --exit-code -- docs/_static/

      - name: Package builds and its metadata renders
        run: |
          uv build
          uvx twine check dist/*

  wheel:
    # Installs the built wheel into a clean environment, away from the source tree,
    # so a missing data file or an undeclared dependency fails here and not on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Sdist contents
        run: |
          tar -tzf dist/*.tar.gz > sdist.txt
          ! grep -E "CLAUDE.md|\.local\.md|\.github/|uv.lock" sdist.txt
          grep -q "tests/fixtures/eada/schools.xlsx" sdist.txt

      - name: Install the wheel and run the CLI offline
        working-directory: ${{ runner.temp }}
        run: |
          uv venv probe
          uv pip install --python probe "$(ls ${{ github.workspace }}/dist/*.whl)"
          probe/bin/athletevalue assumptions | head -3
          probe/bin/athletevalue --offline --cache-dir empty cache info
          probe/bin/python -c "import athletevalue.api as api; print(api.Session)"
