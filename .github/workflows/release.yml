name: Release

# Publishes to PyPI with Trusted Publishing (OIDC). No API token is stored on any
# machine or in repository secrets. One-time setup on pypi.org is in RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" \
            || (echo "tag ${GITHUB_REF_NAME} does not match pyproject version $version" && exit 1)

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - name: No personal email in the published metadata
        run: |
          python -m zipfile -e "$(ls dist/*.whl)" /tmp/wheel
          if grep -Ei "^(Author|Maintainer)-email:" /tmp/wheel/*.dist-info/METADATA; then
            echo "package metadata carries an email address" && exit 1
          fi

      - name: The wheel works without a checkout
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet "$(ls dist/*.whl)"
          cd /tmp
          /tmp/probe/bin/athletevalue assumptions > /dev/null
          /tmp/probe/bin/python -c \
            "import athletevalue, pathlib, sys; \
             root = pathlib.Path(athletevalue.__file__).parent; \
             missing = [p for p in ('py.typed', 'data/identity/team_crosswalk.csv', 'data/deal_registry/mbb_deals.csv', 'data/pinned_artifacts.json') if not (root / p).exists()]; \
             sys.exit(f'missing from the wheel: {missing}' if missing else 0)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  live-data:
    # A release must not publish numbers the live sources no longer reproduce.
    # regression.yml keeps the weekly cron; this is the same suite, gating the tag.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ATHLETEVALUE_CACHE_DIR: ${{ github.workspace }}/.athletevalue-cache
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .athletevalue-cache
          key: athletevalue-data-${{ hashFiles('src/athletevalue/sources/**', 'src/athletevalue/data/pinned_artifacts.json') }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Full-season fits and cited pages
        run: uv run pytest -m network -q

  publish:
    needs: [build, live-data]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/athletevalue
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740 attestations depend on Sigstore, whose outages block publishing.
          attestations: false
          skip-existing: true
