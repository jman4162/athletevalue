# Program economics: what a win or a tournament bid is worth to a school.

["economics.tournament_unit_value"]
description = """Total value of one NCAA men's tournament unit, paid to the conference in
annual installments. The model discounts those installments to present value; see
economics.unit_payout_installments and economics.unit_discount_rate."""
unit = "USD"
basis = "published_third_party"
value = 2000000.0

["economics.tournament_unit_value".citation]
kind = "press"
title = "Deseret News, via Yahoo Sports: Here's how NCAA tournament schools make money in March Madness"
url = "https://sports.yahoo.com/articles/ncaa-tournament-schools-money-march-172252800.html"
quote = "Each of the now 135 units up for grabs in recent years have been worth about $2 million."
published = "2026-03-17"
license = "factual_citation"

["economics.unit_payout_installments"]
description = """Annual installments a tournament unit is paid in. The unit value is the
total of these, so the model discounts them rather than counting the whole sum at once."""
unit = "years"
basis = "published_third_party"
value = 6.0

["economics.unit_payout_installments".citation]
kind = "press"
title = "Deseret News, via Yahoo Sports: Here's how NCAA tournament schools make money in March Madness"
url = "https://sports.yahoo.com/articles/ncaa-tournament-schools-money-march-172252800.html"
quote = "Conferences distribute the money, roughly $350,000 a year over six years, to their schools as they see fit."
published = "2026-03-17"
license = "factual_citation"

["economics.unit_payout_first_year"]
description = """Years between the tournament and the first installment. Units earned in
one tournament are distributed the following April, so the first dollar arrives in the
next fiscal year, not the season being valued."""
unit = "years"
basis = "modelling_choice"
value = 1.0
rationale = """The NCAA Division I revenue distribution plan pays the basketball
performance fund each April for units earned in previous tournaments, which falls in the
fiscal year after the season. Stated as a modelling choice because no page quotable under
the citation rules pins the lag itself."""

["economics.unit_discount_rate"]
description = """Annual rate used to bring later unit installments to present value, and
to discount next season's revenue carry-over by one year."""
unit = "rate per year"
basis = "user_input"
value = 0.05

["economics.unit_revenue_overlap"]
description = """How the tournament-unit component and the EADA bid effect are kept from
counting the same money. Units earned in one tournament are paid from the next April, so
the same-season bid effect cannot contain them and the annual figure never overlaps; the
first installment can sit inside next season's reported revenue. One of:
"next_season_installment" subtracts that installment from the two-season figure;
"none" assumes the filings exclude unit money; "exclude_units" drops the unit component
from the headline figures and reports it alongside."""
unit = "policy"
basis = "user_input"
value = "next_season_installment"

["economics.bid_ridge_lambda"]
description = "Ridge penalty on the bid model's coefficients, the intercept excluded."
unit = "penalty"
basis = "modelling_choice"
value = 0.01
rationale = """Present for numerical stability, not shrinkage: leaving one season out can
come close to separating the data, where an unpenalised fit runs coefficients off to
large values. The coefficients are on the natural win-percentage scale and are near 15,
so a penalty of 1 already distorts calibration; at 0.01 no coefficient moves materially."""

["economics.conference_unit_share_multiplier"]
description = """Multiplier on an equal split of tournament-unit money among conference
members. 1.0 is an equal split; conferences that reward the earning school use more."""
unit = "multiplier"
basis = "user_input"
value = 1.0

["economics.bootstrap_draws"]
description = "School-cluster bootstrap replicates for the revenue model."
unit = "count"
basis = "modelling_choice"
value = 400.0
rationale = "Enough to estimate an 80% interval of a coefficient to within a few percent."

["economics.panel_first_season"]
description = "First EADA season used in the revenue panel (needs one lagged season)."
unit = "season"
basis = "modelling_choice"
value = 2012.0
rationale = "Possession data start in 2011, so 2012 is the first season with a lagged outcome."

["economics.panel_min_seasons"]
description = "Schools need this many non-allocated seasons to enter the revenue fit."
unit = "count"
basis = "modelling_choice"
value = 4.0
rationale = "School fixed effects with two lags are not identified from fewer seasons."

["economics.revenue_reference_seasons"]
description = "Recent seasons averaged to set a school's revenue base for dollars per win."
unit = "count"
basis = "modelling_choice"
value = 3.0
rationale = "Smooths one-off accounting changes in EADA without reaching back past a coaching era."

["economics.excluded_seasons"]
description = "Seasons left out of the revenue and bid fits."
unit = "seasons"
basis = "modelling_choice"
value = [2020.0, 2021.0]
rationale = """The 2020 NCAA tournament was cancelled, so no team has a bid that season.
Attendance limits in 2020-21 cut ticket revenue for reasons unrelated to winning."""

["economics.house_revenue_share_cap_2026"]
description = """Per-school cap on direct revenue sharing with athletes across all sports under
the House v. NCAA settlement, 2025-26. Context for roster budgets, which also include
collective money; not used in any calculation."""
unit = "USD"
basis = "published_third_party"
value = 20500000.0

["economics.house_revenue_share_cap_2026".citation]
kind = "press"
title = "ESPN: Judge OK's $2.8B settlement, paving way for colleges to pay athletes"
url = "https://www.espn.com/college-sports/story/_/id/45467505/judge-grants-final-approval-house-v-ncaa-settlement"
quote = "The annual cap is expected to start at roughly $20.5 million per school in 2025-26 and increase every year during the decade-long deal."
published = "2025-06-06"
license = "factual_citation"

["economics.max_prob_nonpositive_win_effect"]
description = "Largest allowed share of bootstrap draws with a current-season win effect at or below zero."
unit = "probability"
basis = "modelling_choice"
value = 0.1
rationale = """Program value rests on wins raising revenue. If more than one draw in ten says a
win does not, the dollar figures would present noise as value. Through 2026 no draw
is at or below zero."""

["economics.bid_calibration_max_gap"]
description = "Largest allowed gap between predicted and observed bid rates in any decile of predicted probability."
unit = "probability"
basis = "modelling_choice"
value = 0.05
rationale = """Scored on the fitting rows (about 490 team-seasons per decile), so a gap this
size is a misspecified logistic form rather than sampling noise. Through 2026 the
largest gap is 0.025."""
