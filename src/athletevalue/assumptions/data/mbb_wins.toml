# Converting points per 100 possessions into wins.

["mbb.wins.replacement_definition"]
description = """Which replacement level WAR and pay use: `nba_convention` (the Box Plus/Minus
constant below), `pooled` (this season's fitted coefficient for players under the modelling
threshold) or `bench_median` (the possession-weighted median rating of players ranked in the
bench range by playing time on each team)."""
unit = "choice"
basis = "user_input"
value = "bench_median"

["mbb.wins.replacement_level"]
description = """Net rating of a replacement player under the NBA Box Plus/Minus convention.

Kept as one of three definitions. It was borrowed from another league; in these data
the pooled low-minute coefficient sits far below it (about -12 in 2026), and the choice
roughly doubles every WAR and dollar figure, so it is a scenario input, not a fact."""
unit = "points per 100 possessions"
basis = "user_input"
value = -2.0

["mbb.wins.replacement_level".citation]
kind = "methodology"
title = "Basketball-Reference glossary: Value Over Replacement Player"
url = "https://www.basketball-reference.com/about/glossary.html"
quote = "the points per 100 TEAM possessions that a player contributed above a replacement-level (-2.0) player"
license = "factual_citation"

["mbb.wins.bench_rank_range"]
description = "Playing-time ranks within a team that define the bench for `bench_median`."
unit = "rank"
basis = "modelling_choice"
value = [9.0, 12.0]
rationale = """Five starters and three rotation players are the paid core in the market
allocation; the next four are who plays when one of them cannot. Ranks below 12 are
walk-ons and injuries."""

["mbb.wins.margin_sd_d1_only"]
description = "Fit the game-margin spread on games between two D1 teams only."
unit = "flag"
basis = "modelling_choice"
value = true
rationale = """Non-D1 opponents share one coefficient, so their margins are not something the
ratings can predict; including them raised the spread from 10.9 to 11.6 points in 2026."""

["mbb.wins.non_d1_opponent_floor"]
description = "Rate a non-D1 opponent no worse than the worst D1 team in the win model."
unit = "flag"
basis = "modelling_choice"
value = true
rationale = """The shared non-D1 coefficient (about -55 per 100 in 2026) is pulled down by the
blowouts it absorbs; no D1 team rates below about -35. Either value makes those games
near-certain wins, so the floor changes little and avoids an implausible number."""

["mbb.wins.pythag_exponent"]
description = """Exponent in expected win% = ORtg^x / (ORtg^x + DRtg^x), fitted each season
by least squares on team win percentage."""
unit = "dimensionless"
basis = "derived_from_data"

["mbb.wins.pythag_exponent_reference"]
description = "Published college exponents, used only to check the fitted exponent."
unit = "dimensionless"
basis = "published_third_party"
value = [10.25, 11.5]

["mbb.wins.pythag_exponent_reference".citation]
kind = "methodology"
title = "kenpom.com blog: Ratings Explanation"
url = "https://kenpom.com/blog/ratings-explanation/"
archived_url = "https://web.archive.org/web/20250206234805/https://kenpom.com/blog/ratings-explanation/"
quote = "I am using 11.5 as the exponent."
section = "Later update on the same page: \"Beginning with the 2012 season, I'm using 10.25 for the exponent.\""
license = "factual_citation"

["mbb.wins.game_margin_sd"]
description = """Standard deviation of a game's final margin around its expected margin,
fitted each season from team ratings and actual scores."""
unit = "points"
basis = "derived_from_data"

["mbb.wins.simulation_draws"]
description = "Monte Carlo draws used to propagate rating uncertainty into wins and dollars."
unit = "count"
basis = "modelling_choice"
value = 4000.0
rationale = "Monte Carlo error on an 80% interval endpoint is under 1% of its width at 4,000 draws."

["mbb.wins.interval_level"]
description = "Probability mass of reported intervals."
unit = "probability"
basis = "modelling_choice"
value = 0.8
rationale = """An 80% interval still shows most of the noise in one college season, and
stays narrow enough to separate a starter from a bench player."""

["mbb.wins.exponent_search_bounds"]
description = "Interval searched when fitting the Pythagorean exponent."
unit = "dimensionless"
basis = "modelling_choice"
value = [2.0, 30.0]
rationale = "Brackets every published basketball exponent (about 8 to 17) with room on both sides."

["mbb.wins.margin_sd_band"]
description = "Validation band for the fitted game-margin spread, points."
unit = "points"
basis = "modelling_choice"
value = [10.0, 12.5]
rationale = """The D1-only fit gives 11.15 (2025) and 10.87 (2026). A spread outside this
band means ratings, venues or scores disagree with the games, for example after a
game-matching failure, and every WAR figure scales with its inverse."""

["mbb.wins.team_war_min_correlation"]
description = "Smallest allowed correlation between a team's summed player WAR and its wins."
unit = "correlation"
basis = "modelling_choice"
value = 0.7
rationale = """Summed linear WAR correlates 0.79 (2025) and 0.80 (2026) with team wins. It
cannot reach 1: WAR is linear in net rating, wins also depend on close-game luck, and
garbage time is excluded. A drop below 0.7 would mean the shares, schedule slopes or
ratings no longer add up to team results."""
