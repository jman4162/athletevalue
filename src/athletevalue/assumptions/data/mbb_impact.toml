["mbb.impact.home_court_band"]
description = "Plausible home-court advantage, points per 100 possessions; a sign/scale gate."
unit = "points per 100 possessions"
basis = "published_third_party"
value = [1.0, 4.0]

["mbb.impact.home_court_band".citation]
kind = "methodology"
title = "SportsDataverse ncaa-mbb-hoops-data: RAPM model card, gate table"
url = "https://github.com/sportsdataverse/ncaa-mbb-hoops-data/blob/main/docs/models/rapm.md"
quote = "home-court advantage band | [1.0, 4.0]"
license = "factual_citation"

["mbb.impact.reference_spearman_min"]
description = """Minimum Spearman correlation between this package's net RAPM and the
SportsDataverse league-wide RAPM, for players above the comparison threshold."""
unit = "correlation"
basis = "modelling_choice"
value = 0.9
rationale = """Both fits use the same possessions and penalty but differ in pooling,
garbage-time handling and neutral sites, so identical rankings are not expected.
Below 0.9 a design-matrix bug is more likely than a modelling difference."""

["mbb.impact.reference_min_possessions"]
description = "Offensive possessions required for a player to enter the reference comparison."
unit = "possessions"
basis = "modelling_choice"
value = 500.0
rationale = "Roughly a third of a starter's season; below it both fits are prior-dominated."

["mbb.impact.torvik_spearman_min"]
description = "Minimum Spearman correlation of team net rating with Torvik AdjOE minus AdjDE."
unit = "correlation"
basis = "published_third_party"
value = 0.93

