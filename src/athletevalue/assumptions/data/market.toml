# Roster-market pay: a transparent allocation of reported roster budgets.
#
# No public dataset records what individual college basketball players are paid.
# These entries let the package produce a price estimate anyway, from reported
# budget ranges and reported pay ratios by role, and label it a scenario.

["market.power_conferences"]
