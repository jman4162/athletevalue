["market.budget_range_level"]
description = "Probability mass assigned to a cited (low, high) budget range."
unit = "probability"
basis = "modelling_choice"
value = 0.8
rationale = """The study reports averages "between" two figures without a stated interval.
Reading the range as covering most programs, not all, leaves room for outliers in
both directions without inventing a distribution the source does not give."""

